<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joke Generator</title>
    <style>
      :root {
        --bg: #121826;
        --panel: #1d2433;
        --panel-2: #2a3448;
        --text: #edf2ff;
        --muted: #aeb9d3;
        --accent: #7c9cff;
        --accent-2: #9d7bff;
        --success: #5ee6a8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1b2440, var(--bg) 40%);
        font-family: Arial, sans-serif;
        color: var(--text);
      }

      .app {
        width: min(92vw, 760px);
        background: rgba(29, 36, 51, 0.92);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 22px;
        box-shadow: 0 28px 60px rgba(0, 0, 0, 0.35);
        padding: 2rem;
      }

      h1 {
        margin: 0 0 1.1rem;
        font-size: clamp(2rem, 5vw, 3rem);
        text-align: center;
      }

      .joke-box {
        background: linear-gradient(135deg, rgba(124,156,255,0.12), rgba(157,123,255,0.1));
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 1.5rem;
        min-height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.5rem;
      }

      #jokeText {
        font-size: clamp(1.1rem, 2vw, 1.5rem);
        line-height: 1.7;
        text-align: center;
        color: var(--text);
      }

      .controls {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 0.9rem 1.4rem;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
      }

      .secondary {
        background: rgba(255,255,255,0.08);
        color: var(--text);
      }

      .status {
        margin-top: 1rem;
        min-height: 24px;
        text-align: center;
        color: var(--muted);
        font-size: 0.95rem;
      }

      @media (max-width: 500px) {
        .app {
          padding: 1.3rem;
        }

        .controls {
          flex-direction: column;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <h1>Random Joke Generator</h1>

      <div class="joke-box">
        <p id="jokeText">Click the button to get a joke.</p>
      </div>

      <div class="controls">
        <button class="primary" id="generateBtn">Generate Joke</button>
        <button class="secondary" id="copyBtn">Copy Joke</button>
      </div>

      <div class="status" id="statusText"></div>
    </div>

    <script>
      const jokeText = document.getElementById('jokeText');
      const generateBtn = document.getElementById('generateBtn');
      const copyBtn = document.getElementById('copyBtn');
      const statusText = document.getElementById('statusText');

      async function fetchJoke() {
        statusText.textContent = 'Loading a joke...';

        try {
          const response = await fetch('https://official-joke-api.appspot.com/random_joke');

          if (!response.ok) {
            throw new Error('Failed to fetch joke');
          }

          const data = await response.json();
          const joke = `${data.setup} ${data.punchline}`;
          jokeText.textContent = joke;
          statusText.textContent = 'Fresh joke loaded!';
        } catch (error) {
          jokeText.textContent = 'Oops! The joke API is unavailable right now. Please try again.';
          statusText.textContent = 'Error loading joke.';
          console.error(error);
        }
      }

      generateBtn.addEventListener('click', fetchJoke);

      copyBtn.addEventListener('click', async () => {
        const text = jokeText.textContent;

        if (!text || text.includes('Click the button') || text.includes('Oops!')) {
          statusText.textContent = 'There is no joke to copy yet.';
          return;
        }

        try {
          await navigator.clipboard.writeText(text);
          statusText.textContent = 'Joke copied to clipboard!';
        } catch (error) {
          statusText.textContent = 'Copy failed. Please copy manually.';
          console.error(error);
        }
      });

      fetchJoke();
    </script>
  </body>
</html>
